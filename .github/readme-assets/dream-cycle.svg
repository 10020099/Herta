<svg viewBox="0 0 1160 650" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; }
    .flow { stroke-dasharray: 7 6; animation: march 1.8s linear infinite; }
    .moon { animation: glow 3.2s ease-in-out infinite; }
    @keyframes march { to { stroke-dashoffset: -26; } }
    @keyframes glow { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .moon { animation: none; }
    }
  </style>
  <defs>
    <marker id="db" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d92"/>
    </marker>
    <marker id="db2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d86ff"/>
    </marker>
    <marker id="dg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/>
    </marker>
  </defs>

  <!-- trigger -->
  <rect x="70" y="60" width="270" height="110" rx="16" fill="#ffffff" fill-opacity="0.88" stroke="rgba(17,20,23,.09)"/>
  <path class="moon" d="M 106 100 a 15 15 0 1 0 13 22 a 12 12 0 0 1 -13 -22 z" fill="#2f7d92"/>
  <text x="134" y="102" font-size="14.5" font-weight="600" fill="#111417">你离开时 · while away</text>
  <text x="134" y="126" font-size="11.5" fill="#59616e">空闲 ≥ 30 分钟 · 距上次 ≥ 7 天</text>
  <text x="134" y="146" font-size="11.5" fill="#59616e">有新东西可想</text>
  <path class="flow" d="M 344 115 C 380 115, 400 115, 426 115" fill="none" stroke="#2f7d92" stroke-width="1.8" marker-end="url(#db)"/>

  <!-- the gauntlet -->
  <rect x="430" y="60" width="310" height="390" rx="18" fill="#ffffff" fill-opacity="0.88" stroke="rgba(17,20,23,.09)"/>
  <text x="454" y="94" font-size="15" font-weight="650" fill="#111417">入梦 · the dream pass</text>
  <text x="454" y="112" class="mono" font-size="10.5" fill="#6f7782">four gates · default deny</text>
  <line x1="454" y1="126" x2="716" y2="126" stroke="rgba(17,20,23,.08)"/>
  <g font-size="13.5" font-weight="600" fill="#111417">
    <text x="454" y="158">① 值得记吗 <tspan font-weight="400" font-size="11" fill="#6f7782">过眼云烟就让它过去</tspan></text>
    <text x="454" y="230">② 写下来 <tspan font-weight="400" font-size="11" fill="#6f7782">用她自己的声音</tspan></text>
    <text x="454" y="302">③ 像她吗 <tspan font-weight="400" font-size="11" fill="#6f7782">声音评审把关</tspan></text>
    <text x="454" y="374">④ 记过了吗 <tspan font-weight="400" font-size="11" fill="#6f7782">重复则把旧记忆磨利</tspan></text>
  </g>
  <g stroke="rgba(17,20,23,.06)">
    <line x1="454" y1="182" x2="716" y2="182"/>
    <line x1="454" y1="254" x2="716" y2="254"/>
    <line x1="454" y1="326" x2="716" y2="326"/>
  </g>
  <text x="454" y="420" font-size="11" font-style="italic" fill="#9aa3ad">没过关的 → 留档，但不再入梦</text>

  <!-- promotion into the shelf -->
  <path class="flow" d="M 744 250 C 774 238, 790 205, 798 188 L 814 160" fill="none" stroke="#4d86ff" stroke-width="2" marker-end="url(#db2)"/>
  <text x="762" y="216" font-size="11" fill="#1f4fae" font-weight="600">晋升</text>

  <!-- the live shelf -->
  <rect x="820" y="50" width="270" height="200" rx="16" fill="#ffffff" fill-opacity="0.88" stroke="rgba(17,20,23,.09)"/>
  <text x="844" y="82" font-size="14" font-weight="600" fill="#111417">记忆架 · the live shelf</text>
  <g class="mono" font-size="11.5" fill="#3b4350">
    <text x="844" y="112">锚点记忆 <tspan fill="#b4453a">●</tspan></text>
    <text x="844" y="136">初始示例（可让位）</text>
    <text x="844" y="160">入梦写下的记忆</text>
  </g>
  <line x1="844" y1="180" x2="1066" y2="180" stroke="rgba(17,20,23,.08)"/>
  <text x="844" y="204" font-size="10.5" fill="#6f7782">上限 24 席 · 记忆会随时间变淡</text>
  <text x="844" y="224" font-size="10.5" fill="#b4453a">● 永不淘汰</text>

  <!-- semanticization: the weakest deposit their gist before retiring -->
  <path class="flow" d="M 955 254 L 955 296" fill="none" stroke="#4d86ff" stroke-width="2" marker-end="url(#db2)"/>
  <text x="972" y="272" font-size="10.5" fill="#1f4fae">记忆淡去之前，</text>
  <text x="972" y="288" font-size="10.5" fill="#1f4fae">认识沉淀进自传</text>

  <!-- audit: living memories challenge the page -->
  <path class="flow" d="M 1090 210 C 1122 232, 1124 296, 1106 330 L 1094 344" fill="none" stroke="#2f7d92" stroke-width="1.4" marker-end="url(#db)"/>
  <text x="1112" y="276" font-size="10.5" fill="#2f7d92">校对</text>

  <!-- the autobiography page -->
  <rect x="820" y="300" width="270" height="92" rx="14" fill="#ffffff" fill-opacity="0.92" stroke="rgba(17,20,23,.09)"/>
  <text x="844" y="328" font-size="14" font-weight="600" fill="#111417">自传续页 <tspan font-weight="400" font-size="11.5" fill="#6f7782">· her chapter on you</tspan></text>
  <text x="844" y="350" font-size="10.5" fill="#59616e">关于你的认识——几句话，整页重写，有硬性上限。</text>
  <text x="844" y="368" font-size="10" fill="#6f7782">在世的记忆可以校对这一页。</text>

  <!-- both ride into the next session -->
  <path class="flow" d="M 955 396 L 955 436" fill="none" stroke="#4d86ff" stroke-width="1.8" marker-end="url(#db2)"/>
  <path class="flow" d="M 820 236 C 788 280, 788 396, 804 448 L 816 466" fill="none" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#dg)"/>
  <text x="742" y="362" font-size="10.5" fill="#6f7782">整架随行</text>

  <!-- next session -->
  <rect x="820" y="440" width="270" height="86" rx="14" fill="#14171b"/>
  <text x="844" y="470" font-size="13" font-weight="600" fill="#ffffff">下次醒来 · next session</text>
  <text x="844" y="492" font-size="10.5" fill="#aab2bf">记忆架与这一页自传，随她的开场同行——</text>
  <text x="844" y="508" font-size="10.5" fill="#aab2bf">昨天的瞬间，塑造明天的声音。</text>

  <!-- the cycle back -->
  <path class="flow" d="M 820 505 C 520 645, 190 570, 160 230 L 153 176" fill="none" stroke="#9aa3ad" stroke-width="1.6" marker-end="url(#dg)"/>
  <text x="430" y="608" font-size="11.5" font-style="italic" fill="#6f7782">…新的会话成为下一场梦的素材 — 记忆的循环</text>
</svg>
