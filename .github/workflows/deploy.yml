# Deploy the intro website (website/dist) to GitHub Pages.
# The website mounts the REAL GUI renderer, so the build needs the workspace
# libs' dist first (tsc -b) — @herta/core/text-sanitize is a runtime import.
# Enable in repo Settings → Pages → Source: GitHub Actions.
name: Deploy website to GitHub Pages

# NO automatic trigger (owner 2026-08-03): while the repo is private, every
# run burns paid minutes, and mirror pushes were redeploying an unchanged
# site several times a day. Deploy is MANUAL — run it from the Actions tab
# after a website-affecting change lands. The deployed bundle = website/src
# + the GUI renderer (aliased @gui in vite.config.ts, deep-imported from
# source) + @herta/core's text-sanitize (the one runtime core import).
# When the repo goes public (free minutes), a push trigger can return; the
# old path filter lives in git history at this file, 2026-08-03.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # gui's electron devDep is irrelevant to the website build — skip the
      # ~100MB binary download.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # BEFORE setup-node: v5's package-manager-cache autodetects pnpm from
      # the lockfile and needs the pnpm executable to exist during setup.
      - name: Enable corepack (pnpm via packageManager field)
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace libraries
        run: pnpm build

      - name: Build website
        run: pnpm --filter @herta/website build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
