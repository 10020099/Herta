<svg viewBox="0 0 1160 650" xmlns="http://www.w3.org/2000/svg" font-family="Inter, ui-sans-serif, system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <!-- EN twin of dream-cycle.svg (owner 2026-08-03: the diagrams were
       CN-only even on the EN site). Same geometry, English text; the
       in-universe CN terms ride along as flavor (入梦 / 记忆架), mirroring
       how the zh original carried EN subtitles. -->
  <style>
    .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; }
    .flow { stroke-dasharray: 7 6; animation: march 1.8s linear infinite; }
    .moon { animation: glow 3.2s ease-in-out infinite; }
    @keyframes march { to { stroke-dashoffset: -26; } }
    @keyframes glow { 0%, 100% { opacity: 0.75; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .moon { animation: none; }
    }
  </style>
  <defs>
    <marker id="db" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f7d92"/>
    </marker>
    <marker id="db2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d86ff"/>
    </marker>
    <marker id="dg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/>
    </marker>
  </defs>

  <!-- trigger -->
  <rect x="70" y="60" width="270" height="110" rx="16" fill="#ffffff" fill-opacity="0.88" stroke="rgba(17,20,23,.09)"/>
  <path class="moon" d="M 106 100 a 15 15 0 1 0 13 22 a 12 12 0 0 1 -13 -22 z" fill="#2f7d92"/>
  <text x="134" y="102" font-size="14.5" font-weight="600" fill="#111417">While you're away</text>
  <text x="134" y="126" font-size="11.5" fill="#59616e">idle ≥ 30 min · ≥ 7 days since last</text>
  <text x="134" y="146" font-size="11.5" fill="#59616e">something new worth thinking about</text>
  <path class="flow" d="M 344 115 C 380 115, 400 115, 426 115" fill="none" stroke="#2f7d92" stroke-width="1.8" marker-end="url(#db)"/>

  <!-- the gauntlet -->
  <rect x="430" y="60" width="310" height="390" rx="18" fill="#ffffff" fill-opacity="0.88" stroke="rgba(17,20,23,.09)"/>
  <text x="454" y="94" font-size="15" font-weight="650" fill="#111417">The dream pass · 入梦</text>
  <text x="454" y="112" class="mono" font-size="10.5" fill="#6f7782">four gates · default deny</text>
  <line x1="454" y1="126" x2="716" y2="126" stroke="rgba(17,20,23,.08)"/>
  <g font-size="13.5" font-weight="600" fill="#111417">
    <text x="454" y="158">① Worth keeping? <tspan font-weight="400" font-size="11" fill="#6f7782">passing moments pass</tspan></text>
    <text x="454" y="230">② Write it down <tspan font-weight="400" font-size="11" fill="#6f7782">in her own voice</tspan></text>
    <text x="454" y="302">③ Does it sound like her? <tspan font-weight="400" font-size="11" fill="#6f7782">a judge gates it</tspan></text>
    <text x="454" y="374">④ Already kept? <tspan font-weight="400" font-size="11" fill="#6f7782">repeats sharpen the old one</tspan></text>
  </g>
  <g stroke="rgba(17,20,23,.06)">
    <line x1="454" y1="182" x2="716" y2="182"/>
    <line x1="454" y1="254" x2="716" y2="254"/>
    <line x1="454" y1="326" x2="716" y2="326"/>
  </g>
  <text x="454" y="420" font-size="11" font-style="italic" fill="#9aa3ad">fails a gate → archived, never dreamed again</text>

  <!-- promotion into the shelf -->
  <path class="flow" d="M 744 250 C 774 238, 790 205, 798 188 L 814 160" fill="none" stroke="#4d86ff" stroke-width="2" marker-end="url(#db2)"/>
  <text x="784" y="204" text-anchor="end" font-size="11" fill="#1f4fae" font-weight="600">promoted</text>

  <!-- the live shelf -->
  <rect x="820" y="50" width="270" height="200" rx="16" fill="#ffffff" fill-opacity="0.88" stroke="rgba(17,20,23,.09)"/>
  <text x="844" y="82" font-size="14" font-weight="600" fill="#111417">The live shelf · 记忆架</text>
  <g class="mono" font-size="11.5" fill="#3b4350">
    <text x="844" y="112">anchor memories <tspan fill="#b4453a">●</tspan></text>
    <text x="844" y="136">starter examples (yield their seats)</text>
    <text x="844" y="160">memories written in dreams</text>
  </g>
  <line x1="844" y1="180" x2="1066" y2="180" stroke="rgba(17,20,23,.08)"/>
  <text x="844" y="204" font-size="10.5" fill="#6f7782">24 seats · memories fade with time</text>
  <text x="844" y="224" font-size="10.5" fill="#b4453a">● never evicted</text>

  <!-- semanticization: the weakest deposit their gist before retiring -->
  <path class="flow" d="M 955 254 L 955 296" fill="none" stroke="#4d86ff" stroke-width="2" marker-end="url(#db2)"/>
  <text x="972" y="272" font-size="10.5" fill="#1f4fae">before a memory fades,</text>
  <text x="972" y="288" font-size="10.5" fill="#1f4fae">its gist settles into the book</text>

  <!-- audit: living memories challenge the page -->
  <path class="flow" d="M 1090 210 C 1122 232, 1124 296, 1106 330 L 1094 344" fill="none" stroke="#2f7d92" stroke-width="1.4" marker-end="url(#db)"/>
  <text x="1156" y="240" text-anchor="end" font-size="10.5" fill="#2f7d92">audit</text>

  <!-- the autobiography page -->
  <rect x="820" y="300" width="270" height="92" rx="14" fill="#ffffff" fill-opacity="0.92" stroke="rgba(17,20,23,.09)"/>
  <text x="844" y="328" font-size="14" font-weight="600" fill="#111417">The autobiography <tspan font-weight="400" font-size="11.5" fill="#6f7782">· her chapter on you</tspan></text>
  <text x="844" y="348" font-size="10.5" fill="#59616e">What she knows of you —</text>
  <text x="844" y="362" font-size="10.5" fill="#59616e">a few sentences, rewritten whole.</text>
  <text x="844" y="378" font-size="10" fill="#6f7782">Living memories can audit this page.</text>

  <!-- both ride into the next session -->
  <path class="flow" d="M 955 396 L 955 436" fill="none" stroke="#4d86ff" stroke-width="1.8" marker-end="url(#db2)"/>
  <path class="flow" d="M 820 236 C 788 280, 788 396, 804 448 L 816 466" fill="none" stroke="#9aa3ad" stroke-width="1.5" marker-end="url(#dg)"/>
  <text x="726" y="362" font-size="10.5" fill="#6f7782">the shelf rides along</text>

  <!-- next session -->
  <rect x="820" y="440" width="270" height="86" rx="14" fill="#14171b"/>
  <text x="844" y="470" font-size="13" font-weight="600" fill="#ffffff">Next time she wakes</text>
  <text x="844" y="492" font-size="10.5" fill="#aab2bf">Shelf and page ride along with her opening —</text>
  <text x="844" y="508" font-size="10.5" fill="#aab2bf">yesterday's moments shape tomorrow's voice.</text>

  <!-- the cycle back -->
  <path class="flow" d="M 820 505 C 520 645, 190 570, 160 230 L 153 176" fill="none" stroke="#9aa3ad" stroke-width="1.6" marker-end="url(#dg)"/>
  <text x="430" y="608" font-size="11.5" font-style="italic" fill="#6f7782">…new sessions become the next dream's material — the cycle of memory</text>
</svg>
